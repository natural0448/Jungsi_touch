name: Project consistency

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  project-consistency:
    name: project-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout committed files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check planning routing layers and exclusions
        run: python -B scripts/check_project_consistency.py --revision HEAD
      - name: Prepare retained hash-pinned backend runtime
        run: |
          python -B scripts/bootstrap_backend_runtime.py --destination outputs/ci_backend_runtime
          echo "PYTHONPATH=$PWD/outputs/ci_backend_runtime/site" >> "$GITHUB_ENV"
      - name: Test only the committed snapshot
        run: python -B scripts/run_committed_tests.py --revision HEAD
